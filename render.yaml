# Render Blueprint for the FastAPI backend only. The frontend deploys to
# Vercel separately (see frontend/README.md) -- Render's free web service
# tier is used here since persistence has moved to Firestore, so this
# service needs no attached disk (CLAUDE.md deploy decision: Render's own
# disk does not survive a redeploy).
#
# Secrets (sync: false) are intentionally left blank here -- Render prompts
# for them once at Blueprint creation and stores them outside this file.
# See .env.example at the repo root for what each one is and where to get it.
services:
  - name: lmd-backend
    type: web
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn lmd.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    envVars:
      - key: PYTHONUTF8
        value: "1"
      # OMP/glibc thread-arena settings to keep RapidOCR's onnxruntime
      # sessions inside the 512MB instance cap. onnxruntime already gets
      # intra_op/inter_op_num_threads=1 in backend/lmd/cv/pipeline_a.py;
      # these two env vars close the remaining native-thread memory paths
      # (OpenMP's own pool, glibc's per-thread malloc arenas).
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OMP_WAIT_POLICY
        value: "PASSIVE"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: FIRESTORE_CREDENTIALS_JSON
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LMD_INSPECTOR_API_TOKEN
        sync: false
      - key: LMD_EVIDENCE_SIGNING_KEY
        sync: false
      - key: LMD_CORS_ORIGINS
        sync: false
